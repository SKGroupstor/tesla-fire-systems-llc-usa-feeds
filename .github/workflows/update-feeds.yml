name: Update feeds

# Crawls the store every day and republishes the feeds when anything changed
# (price, sale price, stock, title, description, images, new or removed products).
# Every Monday it also runs a forced weekly refresh.

on:
  schedule:
    - cron: "17 8,15,21 * * *"   # three checks a day: ~3:17 AM, ~10:17 AM, ~4:17 PM Toronto
    - cron: "41 9 * * 1"   # weekly forced refresh, Mondays ~4:41 AM Toronto
  workflow_dispatch:
    inputs:
      force:
        description: "Force a weekly-style refresh"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/build-feeds.mjs"
      - "feeds.config.json"
      - ".github/workflows/update-feeds.yml"

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild feeds from the live store
        env:
          FORCE: ${{ (github.event.schedule == '41 9 * * 1' || inputs.force) && '1' || '0' }}
        run: node scripts/build-feeds.mjs

      - name: Commit and publish if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update feeds from live store [automated]"
          # Someone may have pushed while this run was building; replay on top of it.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            sleep 5
          done
          # Pushes made with the workflow token don't start other workflows,
          # so publish to the Pages branch here as well.
          git push --force origin HEAD:refs/heads/gh-pages
