name: Update feeds

# Crawls the store and republishes the feeds when anything changed
# (price, sale price, stock, title, description, images, new or removed products).
#
# PRIMARY trigger: the Cloudflare Worker "skgroups-monitor-scheduler" (SK GROUPS account)
# starts this on time at 3:17am, 10:17am and 4:17pm Toronto daily, plus a forced weekly
# refresh Mondays at 4:41am Toronto.
# SILENT BACKUP: the GitHub crons below run ~30 minutes later. A second run finds
# "No changes" and does nothing, so nothing is duplicated.

on:
  schedule:
    - cron: "47 8,15,21 * * *"   # backup checks: ~3:47 AM, ~10:47 AM, ~4:47 PM Toronto (EST)
    - cron: "11 10 * * 1"   # backup weekly forced refresh, Mondays ~5:11 AM Toronto (EST)
  workflow_dispatch:
    inputs:
      force:
        description: "Force a weekly-style refresh"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/build-feeds.mjs"
      - "feeds.config.json"
      - ".github/workflows/update-feeds.yml"

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild feeds from the live store
        env:
          FORCE: ${{ (github.event.schedule == '11 10 * * 1' || inputs.force) && '1' || '0' }}
        run: node scripts/build-feeds.mjs

      - name: Commit and publish if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update feeds from live store [automated]"
          # Someone may have pushed while this run was building; replay on top of it.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            sleep 5
          done
          # Pushes made with the workflow token don't start other workflows,
          # so publish to the Pages branch here as well.
          git push --force origin HEAD:refs/heads/gh-pages
